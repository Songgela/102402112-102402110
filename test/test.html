<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单元测试 · 福大拾光</title>
  <link rel="stylesheet" href="lib/mocha.css">
  <style>
    /* 让测试报告更醒目：自定义顶部信息条 */
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    #banner {
      background: linear-gradient(135deg, #7c5cff 0%, #5b3fd6 100%);
      color: #fff; padding: 26px 30px;
    }
    #banner h1 { font-size: 21px; margin-bottom: 6px; font-weight: 800; }
    #banner p { font-size: 13px; opacity: .9; line-height: 1.7; }
    #banner code {
      background: rgba(255, 255, 255, .18); padding: 2px 7px;
      border-radius: 4px; font-size: 12.5px;
    }
    #summary-tip {
      margin: 16px 30px 0; padding: 12px 16px; border-radius: 8px;
      background: #f0f2f5; font-size: 13px; color: #5b6474;
    }
  </style>
</head>
<body>

  <div id="banner">
    <h1>🧪 福大拾光 · 单元测试报告</h1>
    <p>
      测试对象：<code>js/store.js</code>（核心业务逻辑层） &nbsp;|&nbsp;
      测试框架：<code>Mocha 10</code> + <code>Chai 4</code>
    </p>
    <p style="margin-top:6px">
      覆盖范围：搜索匹配 · 多条件筛选 · 状态更新 · 表单校验 · 统计计算 · 工具函数 · 本地持久化 · 示例数据质量
    </p>
  </div>

  <div id="summary-tip">
    💡 提示：报告已按「测试分组 → 单条用例」逐级展开渲染在下方，绿色对勾表示通过。
    顶部统计条会显示 <strong>61 passing</strong>；若出现红色的失败项，展开对应用例即可看到具体断言失败原因。
    <br>⌨️ 命令行模式：在项目根目录执行 <code>npm test</code>，效果相同。
  </div>

  <!-- Mocha 将把测试报告渲染到 #mocha 中 -->
  <div id="mocha"></div>

  <!-- ============ 引入测试框架（本地文件，无需联网，双击即可运行） ============ -->
  <script src="lib/mocha.js"></script>
  <script src="lib/chai.js"></script>
  <script>
    // 配置 Mocha：
    // - ui: 'bdd' 表示用 describe / it 风格写用例
    // - reporter: 'html' 会把报告直接渲染到下面的 #mocha 容器里
    //   （若用 'spec' 则只往浏览器控制台打印，页面上会是空白）
    mocha.setup({ ui: 'bdd', reporter: 'html' });
  </script>

  <!-- ============ 引入被测代码 ============ -->
  <script src="../js/store.js"></script>
  <script src="../js/data.js"></script>

  <!-- ============ 引入测试用例 ============ -->
  <script src="store.test.js"></script>

  <!-- ============ 运行测试 ============ -->
  <script>
    mocha.run();
  </script>

  <!-- ============ 环境自检（兜底提示） ============ -->
  <script>
    // 正常情况下：双击本文件用 Chrome 打开（地址栏以 file:/// 开头），测试全部通过。
    // 若本页面被放在「受限预览面板 / 沙箱 iframe」中打开（地址栏是 http://127.0.0.1:端口/...），
    // 会出现两类典型报错：
    //   1) SecurityError: Failed to read the 'localStorage'  —— 沙箱禁用了本地存储；
    //   2) TypeError: Cannot read properties of undefined    —— ../js/*.js 相对路径加载不到。
    // 这时页面会全部变红。下面的自检会在检测到这种情况时，把顶部提示条替换为红色警告并给出解决方法。
    window.addEventListener('load', function () {
      setTimeout(function () {
        var okStore = typeof window.LFStore !== 'undefined';
        var okData = typeof window.LFData !== 'undefined';
        var storageOk = true;
        try { window.localStorage.getItem('_probe_'); } catch (err) { storageOk = false; }
        if (okStore && okData && storageOk) { return; } // 环境正常，不打扰

        var tip = document.getElementById('summary-tip');
        if (!tip) { return; }
        tip.style.background = '#fdecea';
        tip.innerHTML =
          '<strong style="color:#c0392b">⚠️ 检测到运行环境受限，测试无法正常执行</strong><br>' +
          '当前地址：<code>' + window.location.href.slice(0, 70) + '</code><br>' +
          (okStore ? '' : '· <code>js/store.js</code> 未加载成功（TypeError: reading \'xxx\' of undefined）<br>') +
          (okData ? '' : '· <code>js/data.js</code> 未加载成功<br>') +
          (storageOk ? '' : '· <code>localStorage</code> 被当前环境禁用（SecurityError）<br>') +
          '<strong style="color:#c0392b">解决方法：在文件资源管理器中直接双击本文件（test/test.html），' +
          '用 Chrome 打开即可——地址栏应以 file:/// 开头，不要通过预览面板或受限 iframe 打开。</strong>';
      }, 1200);
    });
  </script>

</body>
</html>
